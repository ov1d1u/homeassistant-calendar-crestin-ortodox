version: 2

updates:
  # Python development dependencies (requirements_dev.txt).
  # The integration itself has no runtime requirements (manifest.json
  # "requirements" is empty), so everything here is dev/test tooling.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    assignees:
      - "ov1d1u"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps-dev"
      include: "scope"
    versioning-strategy: increase
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by the workflows in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    assignees:
      - "ov1d1u"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
